stages:
  - push
  - deploy

build frontend image:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build --pull -t ${CI_REGISTRY_IMAGE}/nuxt .
    - docker login -u gitlab-ci-token -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
    - docker push ${CI_REGISTRY_IMAGE}/nuxt
  only:
    refs:
      - main
  tags:
    - docker
    - $CI_JOB_STAGE

build dev image:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build --pull -t ${CI_REGISTRY_IMAGE}/nuxt:dev .
    - docker login -u gitlab-ci-token -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
    - docker push ${CI_REGISTRY_IMAGE}/nuxt:dev
  only:
    refs:
      - dev
  tags:
    - docker
    - $CI_JOB_STAGE

deploy frontend service:
  stage: deploy
  script:
    - pwd
    - docker login -u gitlab-ci-token -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
    - docker pull ${CI_REGISTRY_IMAGE}/nuxt
    - docker service update -q --force korabliki_nuxt
    - docker rmi -f --no-prune $(docker images -q -f dangling=true ${CI_REGISTRY_IMAGE}/nuxt)
  only:
    refs:
      - main
  tags:
    - shell
    - $CI_JOB_STAGE

deploy dev service:
  stage: deploy
  script:
    - pwd
    - docker login -u gitlab-ci-token -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
    - docker pull ${CI_REGISTRY_IMAGE}/nuxt:dev
    - docker service update -q --force korabliki_dev_nuxt
  only:
    refs:
      - dev
  tags:
    - shell
    - $CI_JOB_STAGE
