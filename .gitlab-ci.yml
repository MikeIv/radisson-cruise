stages:
  - push
  - deploy
  - test

build prod image:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  environment:
    name: prod
    url: https://${LANG_RU}
  script:
    - |
      docker build \
        --build-arg BASE_URL=${BASE_URL} \
        --build-arg API_BASE_URL=${BASE_URL}/api/v1/ \
        --build-arg IMAGE_URL=${BASE_URL}/optimize/ \
        --build-arg LANG_RU=${LANG_RU} \
        --build-arg LANG_EN=${LANG_EN} \
        --build-arg LANG_ZH=${LANG_ZH} \
        --build-arg ENVIRONMENT=${CI_ENVIRONMENT_NAME} \
        -t ${CI_REGISTRY_IMAGE}/nuxt:${CI_COMMIT_TAG} \
        -t ${CI_REGISTRY_IMAGE}/nuxt --pull .
    - docker login -u gitlab-ci-token -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
    - docker push ${CI_REGISTRY_IMAGE}/nuxt:${CI_COMMIT_TAG}
    - docker push ${CI_REGISTRY_IMAGE}/nuxt
  only:
    variables:
      - $CI_COMMIT_TAG =~ /^v\d.*/
  tags:
    - docker
    - $CI_JOB_STAGE

build dev image:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  environment:
    name: dev
    url: http://${LANG_RU}
  script:
    - |
      docker build \
        --build-arg BASE_URL=${BASE_URL} \
        --build-arg API_BASE_URL=${BASE_URL}/api/v1/ \
        --build-arg IMAGE_URL=${BASE_URL}/optimize/ \
        --build-arg LANG_RU=${LANG_RU} \
        --build-arg LANG_EN=${LANG_EN} \
        --build-arg LANG_ZN=${LANG_ZN} \
        --build-arg ENVIRONMENT=${CI_ENVIRONMENT_NAME} \
        -t ${CI_REGISTRY_IMAGE}/nuxt:${CI_COMMIT_REF_NAME} --pull .
    - docker login -u gitlab-ci-token -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
    - docker push ${CI_REGISTRY_IMAGE}/nuxt:${CI_COMMIT_REF_NAME}
  only:
    variables:
      - $CI_COMMIT_REF_NAME =~ /^dev.*$/
  tags:
    - docker
    - $CI_JOB_STAGE

deploy prod service:
  stage: deploy
  environment:
    name: prod
    url: https://${LANG_RU}
  script:
    - docker login -u gitlab-ci-token -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
    - docker pull ${CI_REGISTRY_IMAGE}/nuxt:${CI_COMMIT_TAG}
    - docker service update -q --force --with-registry-auth --image ${CI_REGISTRY_IMAGE}/nuxt:${CI_COMMIT_TAG} korabliki_nuxt
    - docker exec $(docker ps -q -f name=korabliki_nginx) find /var/cache/nginx/cache -type f -delete
    - php /home/webuser/korabliki/bin/send_telegram.php release ${CI_COMMIT_TAG} "${CI_COMMIT_TAG_MESSAGE}" "$CI_COMMIT_TITLE"
  only:
    variables:
      - $CI_COMMIT_TAG =~ /^v\d.*/
  allow_failure: false
  tags:
    - shell
    - $CI_JOB_STAGE
    - $CI_ENVIRONMENT_NAME

deploy dev service:
  stage: deploy
  environment:
    name: dev
    url: http://${LANG_RU}
  script:
    - docker login -u gitlab-ci-token -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
    - docker pull ${CI_REGISTRY_IMAGE}/nuxt:${CI_COMMIT_REF_NAME}
    - docker service update -q --force --with-registry-auth --image ${CI_REGISTRY_IMAGE}/nuxt:${CI_COMMIT_REF_NAME} nuxt2_nuxt
    - docker exec $(docker ps -q -f name=nuxt2_nginx) find /var/cache/nginx/cache -type f -delete
    - php /home/webuser/korabliki/bin/send_telegram.php develop "${CI_COMMIT_TITLE}" "${CI_COMMIT_DESCRIPTION}"
  only:
    refs:
      - dev
  tags:
    - shell
    - $CI_JOB_STAGE
    - $CI_ENVIRONMENT_NAME

test prod site:
  stage: test
  environment:
    name: prod
    url: https://${LANG_RU}
  script:
    - docker run --rm -v $PWD/cypress:/e2e -w /e2e -e CYPRESS_BASE_URL=https://${LANG_RU} -e CYPRESS_API_URL=${BASE_URL} cypress/included -b chrome
  artifacts:
    paths:
      - cypress/cypress/screenshots/spec.cy.js/result.png
      - cypress/cypress/videos/spec.cy.js.mp4
    expire_in: 1 weeks
  only:
    variables:
      - $CI_COMMIT_TAG =~ /^v\d.*/
  when: manual
  tags:
    - docker
    - $CI_JOB_STAGE

test dev site:
  stage: test
  environment:
    name: dev
    url: http://${LANG_RU}
  script:
    - docker run --rm -v $PWD/cypress:/e2e -w /e2e -e CYPRESS_BASE_URL=https://${LANG_RU} -e CYPRESS_API_URL=${BASE_URL} cypress/included -b chrome
  artifacts:
    paths:
      - cypress/cypress/screenshots/spec.cy.js/result.png
      - cypress/cypress/videos/spec.cy.js.mp4
    expire_in: 1 weeks
  only:
    refs:
      - dev
  when: manual
  tags:
    - docker
    - $CI_JOB_STAGE
