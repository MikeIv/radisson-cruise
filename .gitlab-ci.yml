stages:
  - push
  - deploy

build frontend image:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - |
      docker build \
        --build-arg API_BASE_URL=http://new.radisson-cruise.ru/api/v1/ \
        --add-host new.radisson-cruise.ru:192.168.253.227 \
        --pull -t ${CI_REGISTRY_IMAGE}/nuxt .
    - docker login -u gitlab-ci-token -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
    - docker push ${CI_REGISTRY_IMAGE}/nuxt
  only:
    refs:
      - main
  tags:
    - docker
    - $CI_JOB_STAGE

build dev image:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - |
      docker build \
        --build-arg API_BASE_URL=http://korabliki.nuu.ru/api/v1/ \
        --add-host korabliki.nuu.ru:192.168.253.227 \
        --pull -t ${CI_REGISTRY_IMAGE}/nuxt:dev .
    - docker login -u gitlab-ci-token -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
    - docker push ${CI_REGISTRY_IMAGE}/nuxt:dev
  only:
    refs:
      - dev
  tags:
    - docker
    - $CI_JOB_STAGE

deploy frontend service:
  stage: deploy
  script:
    - docker login -u gitlab-ci-token -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
    - docker pull ${CI_REGISTRY_IMAGE}/nuxt
    - docker service update -q --force korabliki_nuxt
    - docker exec $(docker ps -q -f name=korabliki_nginx) find /var/cache/nginx/cache -type f -delete
  only:
    refs:
      - main
  tags:
    - shell
    - $CI_JOB_STAGE

deploy dev service:
  stage: deploy
  script:
    - docker login -u gitlab-ci-token -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
    - docker pull ${CI_REGISTRY_IMAGE}/nuxt:dev
    - docker service update -q --force korabliki_dev_nuxt
    - docker exec $(docker ps -q -f name=korabliki_dev_nginx) find /var/cache/nginx/cache -type f -delete
  only:
    refs:
      - dev
  tags:
    - shell
    - $CI_JOB_STAGE

